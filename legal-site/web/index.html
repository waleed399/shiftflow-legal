<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://shift-right-production.up.railway.app https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ShiftRight</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div class="loading-inner">
    <div class="logo">Shift<span>Right</span></div>
    <p class="loading-msg">Loading your workspace…</p>
    <div class="spinner"></div>
  </div>
</div>

<!-- App shell -->
<div id="app">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <div class="logo">Shift<span>Right</span></div>
    </div>

    <div class="user-card">
      <div class="avatar" id="sb-avatar"></div>
      <div class="user-info">
        <div class="user-name" id="sb-name"></div>
        <div class="user-org"  id="sb-org"></div>
        <div class="plan-badge" id="sb-plan"></div>
      </div>
    </div>

    <nav>
      <div class="nav-item active" id="nav-shifts" onclick="showView('shifts')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Shifts
      </div>
      <div class="nav-item" id="nav-requests" onclick="showView('requests')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Requests
        <span class="nav-badge" id="req-badge"></span>
      </div>
      <div class="nav-item" id="nav-workers" onclick="showView('workers')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Workers
      </div>
      <div class="nav-item" id="nav-availability" onclick="showView('availability')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/></svg>
        Availability
      </div>
      <div class="nav-item" id="nav-profile" onclick="showView('profile')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="sign-out-btn" onclick="signOut()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main>

    <!-- Shifts view -->
    <div id="view-shifts">
      <div class="topbar">
        <span class="topbar-title">Shifts</span>
        <div class="view-toggle">
          <button class="view-toggle-btn active" id="view-list-btn" onclick="setShiftsView('list')" title="List view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-toggle-btn" id="view-table-btn" onclick="setShiftsView('table')" title="Roster view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
          </button>
        </div>
        <div class="week-nav">
          <button class="week-btn" onclick="changeWeek(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="week-label" id="week-label"></span>
          <button class="week-btn" onclick="changeWeek(1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="day-tabs" id="day-tabs"></div>

      <div class="action-bar" id="action-bar" style="display:none">
        <span class="action-bar-label">Day actions:</span>
        <button class="action-btn btn-publish-day" id="btn-publish-day" onclick="publishDay()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Publish all
        </button>
        <button class="action-btn btn-unpublish-day" id="btn-unpublish-day" onclick="unpublishDay()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Unpublish all
        </button>
      </div>

      <div class="content-area">
        <div id="shifts-content">
          <div class="loader-inline"><div class="spinner"></div></div>
        </div>
      </div>

      <button class="fab" id="fab-new-shift" onclick="openCreateShiftModal()" title="Create a new shift" aria-label="Create a new shift">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Availability view -->
    <div id="view-availability" style="display:none">
      <div class="topbar">
        <span class="topbar-title">Availability</span>
        <div class="week-nav">
          <button class="week-btn" onclick="changeAvailWeek(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="week-label" id="avail-week-label"></span>
          <button class="week-btn" onclick="changeAvailWeek(1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
      <div class="content-area">
        <div id="avail-content"></div>
      </div>
    </div>

    <!-- Workers view -->
    <div id="view-workers" style="display:none">
      <div class="topbar">
        <span class="topbar-title">Workers</span>
      </div>
      <div class="content-area">
        <div id="workers-content"></div>
      </div>
    </div>

    <!-- Profile view -->
    <div id="view-profile" style="display:none">
      <div class="topbar">
        <span class="topbar-title">Profile</span>
      </div>
      <div class="content-area">
        <div id="profile-content"></div>
      </div>
    </div>

    <!-- Requests view -->
    <div id="view-requests" style="display:none">
      <div class="topbar">
        <span class="topbar-title">Requests</span>
      </div>
      <div class="req-tabs">
        <button class="req-tab active" id="req-tab-timeoff" onclick="setReqTab('timeoff')">
          Time-off
          <span class="req-tab-badge" id="req-tab-count-timeoff"></span>
        </button>
        <button class="req-tab" id="req-tab-swaps" onclick="setReqTab('swaps')">
          Swaps
          <span class="req-tab-badge" id="req-tab-count-swaps"></span>
        </button>
      </div>
      <div class="content-area">
        <div id="requests-content"></div>
      </div>
    </div>

  </main>
</div>

<!-- Shift detail modal -->
<div class="modal-overlay hidden" id="shift-modal" onclick="onModalOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-dept" id="modal-dept"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close" onclick="closeShiftModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="shift-modal-body">
      <div>
        <div class="modal-section-label">Workers</div>
        <div id="modal-workers-list"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="openAssignPicker()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Assign worker
        </button>
      </div>
    </div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Assign worker picker modal -->
<div class="modal-overlay hidden" id="assign-modal" onclick="onAssignOverlayClick(event)">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-title">Assign worker</div>
        <div class="modal-subtitle">Select a worker to add to this shift</div>
      </div>
      <button class="modal-close" onclick="closeAssignModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input class="picker-search" id="picker-search" placeholder="Search workers…" oninput="filterPicker(this.value)">
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>
</div>

<!-- Create shift modal -->
<div class="modal-overlay hidden" id="create-shift-modal" onclick="onCreateShiftOverlayClick(event)">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-title">Create shift</div>
        <div class="modal-subtitle" id="cs-subtitle"></div>
      </div>
      <button class="modal-close" onclick="closeCreateShiftModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="create-shift-form" onsubmit="submitCreateShift(event)" autocomplete="off">
        <div class="form-row">
          <label class="form-label" for="cs-department">Department</label>
          <select class="form-input" id="cs-department" required></select>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label class="form-label" for="cs-start">Start time</label>
            <input class="form-input" type="time" id="cs-start" required>
          </div>
          <div class="form-row">
            <label class="form-label" for="cs-end">End time</label>
            <input class="form-input" type="time" id="cs-end" required>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="cs-required">Required workers</label>
          <input class="form-input" type="number" id="cs-required" min="1" max="99" value="1" required>
        </div>
        <div class="form-row">
          <label class="form-label" for="cs-notes">Notes <span class="form-optional">(optional)</span></label>
          <textarea class="form-input" id="cs-notes" rows="2" maxlength="500" placeholder="Anything the team should know"></textarea>
        </div>
        <div id="cs-error" class="form-error"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCreateShiftModal()">Cancel</button>
      <button class="btn btn-success" id="cs-submit" onclick="submitCreateShift()">Create shift</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
