<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShiftRight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading screen -->
<div id="loading">
  <div class="logo">Shift<span>Right</span></div>
  <div class="spinner"></div>
</div>

<!-- App shell -->
<div id="app">

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-header">
      <div class="logo">Shift<span>Right</span></div>
    </div>

    <div class="user-card">
      <div class="avatar" id="sb-avatar"></div>
      <div class="user-info">
        <div class="user-name" id="sb-name"></div>
        <div class="user-org"  id="sb-org"></div>
        <div class="plan-badge" id="sb-plan"></div>
      </div>
    </div>

    <nav>
      <div class="nav-item active" id="nav-shifts" onclick="showView('shifts')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Shifts
      </div>
      <div class="nav-item" id="nav-profile" onclick="showView('profile')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="sign-out-btn" onclick="signOut()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main>

    <!-- Shifts view -->
    <div id="view-shifts">
      <div class="topbar">
        <span class="topbar-title">Shifts</span>
        <div class="week-nav">
          <button class="week-btn" onclick="changeWeek(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="week-label" id="week-label"></span>
          <button class="week-btn" onclick="changeWeek(1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="day-tabs" id="day-tabs"></div>

      <div class="action-bar" id="action-bar" style="display:none">
        <span class="action-bar-label">Day actions:</span>
        <button class="action-btn btn-publish-day" id="btn-publish-day" onclick="publishDay()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Publish all
        </button>
        <button class="action-btn btn-unpublish-day" id="btn-unpublish-day" onclick="unpublishDay()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Unpublish all
        </button>
      </div>

      <div class="content-area">
        <div id="shifts-content">
          <div class="loader-inline"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Profile view -->
    <div id="view-profile" style="display:none">
      <div class="topbar">
        <span class="topbar-title">Profile</span>
      </div>
      <div class="content-area">
        <div id="profile-content"></div>
      </div>
    </div>

  </main>
</div>

<!-- Shift detail modal -->
<div class="modal-overlay hidden" id="shift-modal" onclick="onModalOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-dept" id="modal-dept"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close" onclick="closeShiftModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="modal-section-label">Workers</div>
        <div id="modal-workers-list"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="openAssignPicker()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Assign worker
        </button>
      </div>
    </div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Assign worker picker modal -->
<div class="modal-overlay hidden" id="assign-modal" onclick="onAssignOverlayClick(event)">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-title">Assign worker</div>
        <div class="modal-subtitle">Select a worker to add to this shift</div>
      </div>
      <button class="modal-close" onclick="closeAssignModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input class="picker-search" id="picker-search" placeholder="Search workers…" oninput="filterPicker(this.value)">
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
